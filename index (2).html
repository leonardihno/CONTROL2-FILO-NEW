// Las etiquetas [p. X] se convierten en marcas de página.
var D={
g:{name:"Guthrie, «Platón 1 y 2» (pp. 93-136)",
corto:[
["Por qué Platón defiende la ciudad-estado","Platón quiso consolidar la obra de Sócrates y, a la vez, defender la ciudad-estado como unidad política, económica y social [p. 93]. La polis estaba en decadencia por las guerras y las conquistas de Filipo y Alejandro, y Estado y religión eran una sola cosa [pp. 93-94]. Como la filosofía natural, los sofistas y el misticismo socavaban sus bases, decidió reformarla y purificarla, no abolirla, y política y metafísica debían ir juntas [pp. 96-97]."],
["La doctrina de las ideas","Sócrates buscaba definir la justicia, el valor y la bondad [p. 98], pero se objetó que quizá no existen fuera de los actos particulares [p. 99]. Con Heráclito (todo fluye) y Parménides (lo real es permanente) de fondo [p. 100], Platón defiende a la vez los principios morales absolutos y el conocimiento: las Ideas (modelo o patrón) existen en un mundo ideal, fuera del espacio y el tiempo [p. 101]. Las cosas de este mundo participan imperfectamente de ellas [p. 103]."],
["Alma, reminiscencia y mito","Con la enseñanza órfica y pitagórica, Platón afirma que el alma pertenece al mundo eterno, ha tenido muchas vidas y ve el cuerpo como prisión [p. 108]. Saber es recordar: los palos casi iguales despiertan la idea de igualdad que ya conocíamos [p. 109]. Los mitos de Er y del carro alado del Fedro expresan lo que la dialéctica no demuestra, y no se toman como literales [pp. 110-112]. De ahí el filósofo gobernante de la caverna [p. 113]."],
["Justicia como orden del alma y de la ciudad","Contra el hedonismo sofista (Calicles equipara lo bueno con lo agradable) [pp. 116-117], Sócrates respondió con el conocimiento y lo útil, pero eso no bastaba [pp. 119-121]. Platón responde con la función (ergon) y la virtud (arete) como orden: kosmos y taxis [pp. 122-124]. La ciudad tiene tres clases y el alma tres partes (nous, thymos y deseos); la justicia es la salud del alma [pp. 125-128]."],
["Teología y cierre","En Leyes X, Platón rebate a quienes ven en la naturaleza puro azar y en la ley una convención [pp. 131-132]. Sostiene que la inteligencia es anterior a la materia: la psyche, único automotor, es la causa primera [pp. 132-133]. Le importa el alma buena que dirige el cosmos, no si hay uno o muchos dioses [p. 134]. Cierra con la belleza y Eros como camino hacia las Ideas [pp. 135-136]."]],
ext:[
["Motivos y contexto de Platón","pp. 93-97","Platón busca consolidar la obra de Sócrates y defender la ciudad-estado como unidad política, económica y social [p. 93]. Su ruina llegó con Filipo y Alejandro, aunque venía de antes [p. 93]. Estado y religión eran una sola cosa: no había «Iglesia» y Atenea era la patrona de la ciudad [p. 94]. Las leyes se creían de origen divino, comunicadas por Apolo [pp. 94-95]. El ataque venía de tres frentes: filosofía natural (los dioses quizá no existen), sofistas (las leyes las hacen los hombres) y misticismo órfico (la religión es asunto del alma individual) [p. 96]. Platón eligió reformar y purificar la polis, no abolirla; en la República el individuo se subordina al bienestar común [p. 97]. Platón era un pensador político práctico que renunció a la política activa para meditar sobre ideas políticas, y por eso debía elegir entre construir una sociedad y una religión nuevas o sostener la polis [p. 96]. Eligió lo segundo, y la República y las Leyes muestran su fidelidad a ese ideal durante toda su vida [p. 97]. A la crítica de que los gobernantes no serían felices, responde que el objetivo era la felicidad de toda la ciudad y no de una clase [p. 97]. Sócrates, el santo del platonismo, rechazó la fuga por respeto a las decisiones de la ciudad [p. 98]."],
["Sócrates, objeciones y las Ideas","pp. 98-103","Sócrates pedía definir la justicia y cuidar el alma. La objeción: ¿existe la justicia absoluta fuera de los actos justos, o es un fuego fatuo? [p. 99]. La psyche era para los griegos un vapor sin importancia; Sócrates la hace sede de las facultades morales e intelectuales [pp. 99-100]. Heráclito: todo fluye, no hay conocimiento; Parménides: lo real es permanente y solo la mente lo alcanza [p. 100]. Platón concluye que los objetos del conocimiento existen en un mundo ideal, fuera del espacio y el tiempo; «idea» significa modelo o patrón [p. 101]. Sin una base común no podríamos llamar «bueno» a un vino y a un jugador [pp. 101-102]. Lo perceptible participa imperfectamente de las Ideas, relación que Platón expresa con metáforas [p. 103]. La doctrina se extiende a todas las especies naturales, como el caballo [p. 103]. Según la creencia corriente, la psyche era un hálito que dependía del cuerpo y luego pasaba a una existencia pálida y umbrosa [p. 99]. A diferencia de Sócrates, Platón sentía hondo interés por la naturaleza de la realidad, por eso podía unir metafísica y ética [p. 100]. Estaban en discusión los principios morales absolutos y la posibilidad del conocimiento científico; como una solución escéptica le parecía impensable, sostuvo que los objetos del conocimiento existen aparte [p. 101]. Guthrie advierte que «idea» es una traducción impropia, pues sugiere algo sin existencia fuera de la mente [p. 101]. Aristóteles veía como debilidad las metáforas de Platón para la relación entre mundos [p. 103]."],
["Ideas hoy, alma y reminiscencia","pp. 104-109","«Por la belleza son bellas las cosas bellas» significa que no se explica un caso sin la clase a la que pertenece [p. 104]. Guthrie muestra que hoy tratamos las leyes naturales o la «influenza» como si fueran entidades reales [pp. 105-106]. Platón une las Ideas con la enseñanza órfica y pitagórica: el alma es inmortal (o preexistente), el cuerpo es prisión o tumba y saber es recordar [pp. 107-108]. No hay dos cosas exactamente iguales, así que la idea de igualdad no sale de los sentidos: estos solo la despiertan [p. 109]. La filosofía es «preparación para la muerte» [p. 109]. Guthrie nota que la actitud de Platón tiene algo de creencia casi religiosa o mística que los argumentos racionales no explican del todo [p. 103]. Hoy pocos aceptan que el concepto de clase tenga existencia propia y carácter invariable [p. 104]. El Menón intenta tratar la teoría del recuerdo como demostrable y el Fedón combina la prueba dialéctica con un mito final [pp. 109-110]. Una vez puesto en camino por la percepción sensible, el filósofo ignora al cuerpo y subyuga sus deseos para liberar al alma [p. 109]."],
["Mitos y valor del mito","pp. 110-112","El mito de Er cuenta las encarnaciones del alma; beber del Leteo explica que olvidemos lo visto [p. 110]. En el Fedro, el alma es un carro alado: el auriga es la razón, un caballo es el valor y el otro los apetitos [p. 111]. El mito no se toma como literal: abre camino a verdades que el razonamiento dialéctico no demuestra [p. 112]. En el mito de Er, las almas que van a reencarnar deben beber del Leteo, salvo las destinadas a escapar del cuerpo, y el vigor con que resisten revela su avance en la filosofía [p. 110]. En el carro del Fedro, un caballo es obediente y valiente y el otro desobediente y ligado a los apetitos; el carro llegó al borde del universo pero el mal caballo lo derribó [p. 111]. Platón creía que la mente no podía ir más allá con sus solos instrumentos dialécticos [p. 112]."],
["El filósofo gobernante","pp. 112-114","En la alegoría de la caverna, quien sale a la luz siente el deber de volver a instruir a sus compañeros [p. 113]. Los gobernantes deben conocer la Idea del Bien; «no tendrán fin los trastornos hasta que vayan juntos el poder político y la filosofía» [p. 113]. Su formación: educación elemental hasta los 17-18 años, tres de preparación física y militar, diez de matemáticas, cinco de filosofía y cargos a los 35 [pp. 113-114]. Para ellos el poder es carga, no tentación; son los más verdaderamente felices [p. 114]. En cada etapa de la formación algunos individuos son eliminados y solo los seleccionados entran en los cargos [p. 113]. Para dirigir el Estado hacia el bien, los gobernantes deben conocer la verdad y no su sombra, es decir la Idea perfecta de la que las bondades de este mundo son reflejos pálidos [p. 113]. Con esto Guthrie recuerda que Platón no era un contemplativo inmóvil, pues predicaba el sentido del deber [p. 113]."],
["Respuesta ética a los sofistas","pp. 115-121","En sociedades simples no hay conflicto entre deber e interés [p. 115]. En Grecia surge la oposición sofista entre «naturaleza» y «ley»; Calicles identifica lo bueno con lo agradable, y nace el hedonismo [pp. 116-117]. Sócrates responde que hace falta conocimiento: la búsqueda irreflexiva del placer causa desdicha, y lo bueno es lo útil o beneficioso [pp. 117-118]. En el Menón, valor y otras cualidades solo benefician si las guía la sabiduría (nous), por eso virtud es sabiduría [pp. 119-120]. Límite: queda sin responder «¿beneficioso para qué?», y el poder también puede ser fin (Guthrie menciona a Hitler) [pp. 120-121]. La comparación con los oficios es clave para Sócrates: dirigir bien la vida requiere una habilidad como la del zapatero en su oficio [p. 118]. En el Protágoras defiende la equivalencia entre placer y bien en sentido amplio, que incluye los valores espirituales [pp. 118-119]. Así el hedonismo puede refinarse hasta un código de alta moral, aunque Guthrie advierte que esta lectura es discutible [p. 119]. Sócrates redujo todas las virtudes a una, el conocimiento del bien y del mal [p. 119]. El cálculo hedonístico no basta para acordar lo justo, pues dos hombres pueden calcular igual y seguir conductas opuestas [p. 121]."],
["Orden del alma y de la ciudad","pp. 121-130","Todo tiene un ergon (función) y una arete (estado óptimo para cumplirla); ese orden es kosmos y taxis [pp. 122-124]. Ejemplos: la lanzadera del tejedor y el obrero [pp. 122-123]. La justicia se defiende por sí misma, sin premios ni reputación [pp. 123-124]. La ciudad tiene tres clases: gobernantes (sabiduría), guerreros (valor) y productores; la templanza es el acuerdo sobre quién gobierna y la justicia, que cada clase cumpla su función [pp. 125-127]. Se separan poder político y económico [p. 127]. El alma tiene tres partes: nous (razón), thymos (fuerza de voluntad) y deseos; la justicia es su armonía, su salud, y la injusticia una enfermedad [pp. 127-128]. Se prueba con el conflicto entre sed y razón; Sócrates no consideró el thymos [pp. 129-130]. En la República, las opiniones sofistas sostienen que solo se evita dañar por miedo a ser dañado y que los maestros de moral piden apenas aparentar rectitud [p. 123]. Platón rechaza ese criterio individualista y busca defender la justicia por sí misma [pp. 123-124]. Trasímaco se da por satisfecho con ironía y Sócrates señala que aún falta determinar ese estado óptimo del alma [p. 124]. Se busca primero la justicia en la ciudad, en grande, y luego en el individuo [p. 125]. Habrá una aristocracia natural con transferencias de clase si nace un niño excepcional [p. 126]. La clase inferior no equivale al proletariado marxista, pues era la única con propiedad privada [p. 126]. Los gobernantes llevan una vida espartana [p. 127]. La tripartición del alma no es simple analogía: se apoya en que dos impulsos contradictorios no pueden venir de la misma fuente [p. 129]. Con ella termina la controversia naturaleza-ley, pues el alma sana se expresa en actos legales y justos [p. 130]."],
["Teología y cierre","pp. 130-136","La defensa teológica está en Leyes X. Los adversarios dicen que la naturaleza es azar, que el arte es humano y que la justicia es convención [pp. 131-132]. Platón responde que naturaleza y arte coinciden y que la inteligencia es anterior al azar [p. 132]. El movimiento originario es automovimiento y solo la psyche es automotor, así que el alma es la causa primera [p. 133]. Platón es indiferente al monoteísmo o politeísmo: lo importante es que el alma buena dirige el cosmos [p. 134]. Cierra con la estética: la belleza terrenal guía hacia la belleza en sí, y belleza y verdad son lo mismo [pp. 135-136]. Guthrie resume la teología porque completa la refutación de los sofistas y porque la de Aristóteles arranca donde la dejó Platón [p. 131]. En Leyes X, los adversarios dicen que lo más importante es producto de la naturaleza o el azar, que el arte es una fuerza secundaria y que los dioses son artificio humano [pp. 131-132]. Para ellos la «vida de acuerdo con la naturaleza» sería ser más fuerte y no obedecer ley alguna [p. 132]. Platón responde que invirtieron el orden causal: la vida es anterior a la materia [p. 132]. El mal moral indica que actúan almas depravadas junto a una buena, pero el orden cósmico muestra el gobierno de la inteligencia [p. 134]. Guthrie añade que los diálogos son también literatura y teatro, y que la sensibilidad a la belleza lleva al filósofo de la belleza física a la de las acciones, luego a la sabiduría y a la belleza en sí (Banquete) [pp. 135-136]."]]},
c:{name:"Campbell, «Aristóteles: la comunidad cívica» (pp. 71-89)",
corto:[
["Enfoque naturalista y teleológico","Aristóteles ve la sociedad como una empresa ética nacida de la sociabilidad natural, que busca en la comunidad política la bondad moral y la excelencia intelectual [p. 71]. Su filosofía es naturalista (empírica, con más de 150 constituciones estudiadas) y teleológica (cada ser tiene un telos) [p. 72]. A diferencia de Platón, las formas se estudian observando el mundo físico [p. 73]. La política es la ciencia maestra [p. 74]."],
["Teoría del hombre","El hombre es un animal con razón y habla; la razón práctica controla los apetitos y la teórica alcanza la contemplación [p. 74]. Las virtudes son un término medio (la valentía entre cobardía y temeridad) y se forman con educación y hábito [p. 75]. Los vínculos sociales se reúnen bajo la amistad (philia), cuya forma más alta es entre iguales por su bondad [p. 76]."],
["La polis","La familia (oikos), la aldea y la polis forman una progresión, pero la polis es el telos de las anteriores [pp. 77-79]. El oikos es jerárquico: el amo gobierna distinto a la mujer, los hijos y los esclavos [p. 78]. La polis es autosuficiente y permite la amistad entre iguales; Aristóteles rechaza la comunidad total de propiedad [pp. 78-79]."],
["Justicia y constitución","La justicia distributiva reparte según el mérito y la rectificadora corrige injusticias; moral y ley no se separan [p. 80]. Hay seis tipos de polis según quién gobierna y para qué [pp. 82-83]. Aristóteles prefiere una forma mixta cercana a la politeia, con peso de las clases medias, y no defiende una democracia total [pp. 81, 83]."],
["Jerarquía y críticas","Aristóteles no cree en la igualdad humana y su modelo termina en una jerarquía con esclavos naturales y extranjeros al final [pp. 84-85]. Se le critica la falacia naturalista y la esclavitud natural, quizá ideológica [pp. 85-86]. Aporta la base económica de la estabilidad social y el hombre sociable y egoísta a la vez [p. 87]. Hoy su comunidad parecería utópica y opresiva [pp. 88-89]."]],
ext:[
["El enfoque de Aristóteles","pp. 71-74","Para Aristóteles la sociedad es una empresa ética que busca la bondad moral y la excelencia intelectual [p. 71]. Estudió con Platón, fundó el Liceo, no era ateniense y fue tutor de Alejandro [p. 71]. Sus obras clave para la teoría social son la Ética a Nicómaco y la Política [p. 72]. Su filosofía es naturalista (empírica; estudiaron más de 150 constituciones) y teleológica (cada ser tiene una causa final y lo natural es bueno) [p. 72]. A diferencia de Platón, cree que las formas se estudian observando el mundo físico; investiga causas finales, eficientes y materiales [p. 73]. La virtud es el funcionamiento apropiado del hombre, es decir, la felicidad (eudaimonia) [p. 73]. La política es la ciencia maestra y da prioridad al bien de la comunidad sobre el individuo, con cierto holismo normativo y un aspecto autoritario [p. 74]. Campbell señala que Aristóteles nació en el 384 a.C. en Estagira, pasó años fuera de Atenas y fue expulsado por los atenienses poco antes de morir, a los 65 años [pp. 71-72]. Sus obras tratan ciencia natural, metafísica, ética, lógica, retórica, estética y política, muchas como apuntes de conferencias [p. 72]. Distingue las causas final, eficiente (inmediata) y material; el embrión ilustra las tres [p. 73]. Su enfoque es el de un médico y biólogo: crecimiento hacia la madurez y salud como funcionamiento normal, ideas que aplica a la ética [p. 73]. Su universo es una jerarquía de seres [p. 72]."],
["La teoría del hombre","pp. 74-76","El hombre es un animal con razón y habla. La razón práctica controla los apetitos y la teórica comprende el universo; su cima es la vida de contemplación [p. 74]. Sin educación, los hombres tienden a ser avaros y cobardes; sin ley serían «el peor de los animales» [p. 75]. Las virtudes morales son un medio entre extremos (valentía entre cobardía y temeridad) y se forman con educación estricta hasta hacerse hábito [p. 75]. La sociabilidad natural se reúne bajo la amistad (philia); la más alta es entre iguales que se aman por su bondad, posible solo entre pocos ciudadanos [p. 76]. Como pocos la alcanzan, las sociedades reales requieren justicia, educación estatal y coacción [p. 76]. Los apetitos básicos son en parte sociales (compañero sexual, afecto, compañía), pero la búsqueda del placer, del poder y de la posesión ilimitada vuelve malo al hombre no educado [p. 75]. Aun así, Aristóteles cree en su potencial para preferir placeres más elevados [p. 75]. La sociedad es natural porque el hombre tiene en sí las causas eficientes de la vida social y su naturaleza solo se desarrolla en grupo [p. 75]. La cooperación social da además la seguridad y prosperidad necesarias para la contemplación teórica [p. 76]. La philia tiene función sociológica y normativa: hay amistad por placer, por utilidad y, la más alta, por bondad [p. 76]. Aquí se conserva algo del idealismo de Platón [p. 76]."],
["La teoría de la sociedad: oikos, aldea y polis","pp. 77-79","Aristóteles usa el término polis, la comunidad cívica; koinonia es todo grupo social [p. 77]. La familia (oikos) es la unidad económica básica y en ella la amistad no es de iguales: el amo gobierna a la mujer, a los hijos y a los esclavos de forma distinta [pp. 77-78]. La aldea agrupa familias por utilidad [p. 78]. La polis es autosuficiente y permite amistad genuina entre iguales; aunque aparece después, es anterior como telos [pp. 78-79]. Aristóteles rechaza la comunidad total de propiedad y de personas, pero defiende comidas comunes [p. 79]. La polis se distingue de la nación-estado moderna por sus relaciones cara a cara, aunque incorpora el gobierno de la ley [p. 77]. El oikos surge del instinto sexual y del amor de padres e hijos; sirve de defensa y de unidad económica, y la agricultura es la actividad más natural [p. 77]. El amo gobierna a la mujer como monarca limitado, a los hijos como monarca absoluto y es déspota con los esclavos [p. 78]. La polis tiene gente suficiente para la buena vida, pero no tanta que impida conocerse [pp. 78-79]. Los deseos de poder y riqueza deben reprimirse cuando superan la satisfacción de necesidades [p. 79]. Aristóteles es utópico al pedir que toda la cooperación busque la virtud de cada tipo de persona [pp. 79-80]."],
["Justicia, ley y ciudadanía","pp. 79-82","La justicia es el principio del orden político [p. 80]. La distributiva reparte según el mérito (virtud en la aristocracia, riqueza en la oligarquía) y la rectificadora corrige injusticias [p. 80]. Lo moral y lo legal no se distinguen; la ley tiene un núcleo natural y un elemento convencional que varía entre polis [p. 80]. Los gobernantes están sometidos a la ley y no defiende una democracia total, aunque cualquier ciudadano puede ser elegido para cargos [p. 81]. Ciudadano es quien tiene derecho a ocupar un cargo [p. 81]. La virtud del hombre bueno coincide con la del buen ciudadano, y no hay división entre público y privado [p. 82]. Para la mayoría de los habitantes, la amistad solo surge si leyes adecuadas regulan la distribución de premios y honores [p. 80]. Las reglas de justicia se inculcan con un sistema educativo controlado políticamente, con magistrados y tribunales elegidos entre ciudadanos [p. 80]. Las funciones públicas son sobre todo judiciales y ejecutivas, por eso hasta los gobernantes están sometidos a la ley [p. 81]. Busca equilibrio entre ricos y pobres y admite que todos puedan ser elegidos, preservando cierta igualdad [p. 81]. En Atenas la ciudadanía era hereditaria y casi todos los habitantes eran no ciudadanos [p. 81]. Las constituciones son a la vez institucionales y éticas: fijan quién gobierna y el propósito del gobierno [p. 82]."],
["Tipos de polis","pp. 82-84","Seis tipos según quién gobierna y para qué: monarquía, aristocracia y politeia son las buenas; tiranía, oligarquía y democracia, sus versiones corruptas [pp. 82-83]. Aristóteles prefiere una forma mixta cercana a la politeia, con elemento oligárquico y peso de las clases medias [p. 83]. Reconoce la «sabiduría colectiva», pero teme que la masa pobre carezca del ocio para gobernar [pp. 83-84]. Su modelo es una comunidad de iguales unidos por amistad y leyes impersonales, y admite que en la práctica opera cierta oligarquía [p. 84]. El cuerpo soberano declara la guerra y la paz, modifica leyes, juzga casos criminales y elige magistrados; no es soberano en sentido moderno porque gobierna dentro de leyes inmutables [p. 82]. Cada régimen tiene su meta: el rey el honor, el tirano el placer, los aristócratas la virtud, la oligarquía más riqueza, la democracia total libertad y la politeia objetivos moderados [p. 83]. Aristóteles considera la aristocracia una forma ideal, pero apoya una forma mixta, compromiso entre lo mejor y lo practicable [p. 83]. Una politeia lograría sus fines éticos si no hubiera extremos de riqueza o pobreza [p. 84]."],
["Jerarquía social","pp. 84-85","Aristóteles desconfía de la democracia porque no cree en la igualdad humana: las mujeres son inferiores en razón y existen esclavos naturales [p. 84]. Termina en una jerarquía: ricos virtuosos, propietarios agrícolas, trabajadores del comercio y el trabajo manual, y por último esclavos naturales y extranjeros [p. 85]. Las diferencias naturales de intelecto y nacimiento se aplican también a los ciudadanos, algunos de los cuales solo sirven para tareas domésticas y actividades que Aristóteles considera degradantes, como la industria y el comercio [p. 84]. Solo quienes tienen elevada habilidad natural y buena cuna sirven para gobernar [p. 85]. Campbell nota la paradoja: ofreció materiales para una comunidad de iguales y termina en un sistema jerárquico [p. 85]. Por eso, en la práctica, el vínculo social nace del mutuo interés económico más que de la amistad virtuosa [p. 84]."],
["Criticismo y valoración","pp. 85-89","Falacia naturalista: pasa de lo que es natural a lo que debe ser, y su uso de «naturaleza» es ambiguo [pp. 85-86]. Su retrato de Atenas es inexacto y su polis agraria era frágil ante imperios como el de Alejandro [p. 86]. La esclavitud natural es una afirmación empírica sin justificar, quizá ideológica [p. 86]. Sus aportes: la base económica de la estabilidad social y el hombre a la vez sociable y egoísta [p. 87]. La razón práctica da medios, no fines, y su «término medio» es poco convincente [pp. 87-88]. Hay inconsistencia entre ideales democráticos y valores aristocráticos (Marx vio la polis como asociación contra una clase productiva) [p. 88]. Aun así, amistad, ciudadanía y gobierno de la ley siguen siendo atractivos, pero en sociedades grandes sus fusiones parecerían utópicas y opresivas [pp. 88-89]. Los historiadores señalan que los ideales cívicos que Aristóteles admira fueron obra de las clases productivas y no de los propietarios ociosos [p. 86]. Su realismo lo lleva a rechazar la propiedad comunitaria extensa y a observar las causas de la estabilidad social [pp. 86-87]. Su ética combina el telos natural con el equilibrio hallado por intuición intelectual, pero no ofrece estándares para valorar los deseos [p. 87]. Hay una clara inconsistencia entre sus ideales democráticos y las cualidades aristocráticas de su lista de virtudes [p. 88]. Desdeña las actividades comerciales que considera «no naturales» [p. 88]. Para el aristotélico moderno persiste el problema de la extensión: hoy la autosuficiencia exige organizaciones grandes e impersonales [p. 88]."]]},

var total=15,seen={};
function fmt(t){return t.replace(/\[([^\]]+)\]/g,'<span class="anchor">$1</span>')}
function build(k){
 var d=D[k],h='<section class="panel'+(k=='g'?' on':'')+'" data-a="'+k+'" id="P'+k+'"><div class="sub"><button class="on" onclick="subt(\''+k+'\',0)">Resumen corto</button><button onclick="subt(\''+k+'\',1)">Resumen extenso</button></div>';
 h+='<div class="sp on"><p class="lede">'+d.name+'. Repaso rápido de cinco puntos.</p>';
 d.corto.forEach(function(s,i){h+='<div class="step"><h3>'+(i+1)+'. '+s[0]+'</h3><p>'+fmt(s[1])+'</p></div>'});
 h+='</div><div class="sp"><p class="lede">Desarrollo por secciones. Las etiquetas indican la página de origen.</p><div class="acc">';
 d.ext.forEach(function(s,i){var id=k+i;h+='<div class="item"><button class="hd" onclick="acc(this,\''+id+'\')"><span>'+s[0]+'<small>'+s[1]+'</small></span><span class="ch">▾</span></button><div class="bd"><div>'+fmt(s[2])+'</div></div></div>'});
 return h+'</div></div></section>'}
function bridges(){
 var h='<section class="panel" id="Pp"><p class="lede">Conexiones entre ambas lecturas, pensadas para preguntas comparativas.</p>';
 D.puentes.forEach(function(b){h+='<div class="card"><h3>'+b[0]+'</h3><p class="lede" style="font-size:.8rem;margin:0 0 8px">'+b[1]+'</p><div class="cols"><div class="col g"><b>Guthrie (Platón)</b>'+fmt(b[2])+'</div><div class="col c"><b>Campbell (Aristóteles)</b>'+fmt(b[3])+'</div></div><div class="q"><b>Posible pregunta de control</b>'+b[4]+'</div></div>'});
 return h+'</section>'}
document.getElementById('app').innerHTML=build('g')+build('c')+bridges()+'<footer>Herramienta de repaso para el Control de Lectura 2, Filosofía y Ética, Universidad ESAN. Basada en Guthrie (1994) y Campbell. Uso de estudio personal; contrasta siempre con las lecturas.</footer>';

function tab(t){document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t==t)});['g','c','p'].forEach(function(x){document.getElementById('P'+x).classList.toggle('on',x==t)})}
function subt(k,i){var p=document.getElementById('P'+k);p.querySelectorAll('.sub button').forEach(function(b,j){b.classList.toggle('on',j==i)});p.querySelectorAll('.sp').forEach(function(s,j){s.classList.toggle('on',j==i)})}
function acc(h,id){var b=h.nextElementSibling;if(h.classList.toggle('open')){b.style.maxHeight=b.scrollHeight+'px';seen[id]=1;prog()}else b.style.maxHeight=null}
prog();
